<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SOLEM ERP v9 — Dark Mode · Sistema Completo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
/* ═══════════════════════════════════
   DARK MODE PALETTE — SOLEM v9
═══════════════════════════════════ */
:root{
  --bg:#0f0f1a;
  --bg2:#14142a;
  --bg3:#1a1a32;
  --card:#1e1e38;
  --card2:#24243e;
  --border:#2e2e52;
  --border2:#3a3a60;
  --ac:#e8973a;
  --ac2:#f5a94e;
  --ac-glow:rgba(232,151,58,.25);
  --gn:#22c55e;
  --gn2:#16a34a;
  --rd:#ef4444;
  --bl:#3b82f6;
  --pu:#a78bfa;
  --am:#f59e0b;
  --tx:#e2e2f0;
  --tx2:#a0a0c0;
  --tx3:#6060a0;
  --mu:#8080b0;
  --dk:#e8973a;
  --mid:#f5a94e;
  --lt:#2e2e52;
  --cr:#14142a;
  --sb:218px;
  --hh:54px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-ac:0 4px 20px rgba(232,151,58,.3);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ac)}

/* ── Layout ── */
#app{display:flex;height:100vh;overflow:hidden}
#sb{width:var(--sb);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;z-index:50}
#content{flex:1;overflow-y:auto;padding:22px 24px}

/* ── Sidebar ── */
.sb-logo{padding:18px 14px 14px;border-bottom:1px solid var(--border)}
.sb-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:17px;color:#fff;flex-shrink:0;box-shadow:var(--shadow-ac)}
.sb-brand{color:var(--tx);font-weight:700;font-size:13px;font-family:'Playfair Display',serif}
.sb-sub{color:var(--tx3);font-size:8px;letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.sb-section{padding:10px 12px 3px;font-size:8.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--tx3);font-weight:700}
.nav-btn{width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:none;background:transparent;color:var(--tx2);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:2px;font-family:'DM Sans',sans-serif;border-left:3px solid transparent;transition:all .18s}
.nav-btn:hover{background:var(--bg3);color:var(--tx)}
.nav-btn.active{background:rgba(232,151,58,.15);color:var(--ac);border-left-color:var(--ac);font-weight:600}
.nav-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.sb-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:9px;color:var(--tx3);line-height:2}

/* ── Topbar ── */
.tb-left{display:flex;align-items:center;gap:12px}
.tb-crumb{font-size:11px;color:var(--mu)}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--tx2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.tb-btn:hover{background:var(--border);color:var(--tx)}

/* ── Typography ── */
.pg-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--tx);margin-bottom:2px}
.pg-sub{font-size:12px;color:var(--mu);margin-bottom:18px}

/* ── Animation ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-anim{animation:fadeUp .25s ease}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 var(--ac-glow)}50%{box-shadow:0 0 0 8px transparent}}

/* ── KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);transition:all .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:var(--shadow-ac)}
.kpi-l{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-weight:600}
.kpi-v{font-size:19px;font-weight:700;font-family:'Playfair Display',serif;line-height:1.1;color:var(--tx)}
.kpi-s{font-size:10px;color:var(--mu);margin-top:2px}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card:last-child{margin-bottom:0}
.card-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px}

/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── Tables ── */
.twrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead tr{background:var(--bg3)}
th{padding:8px 10px;color:var(--ac);text-align:left;font-weight:600;white-space:nowrap;font-size:11px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:rgba(232,151,58,.06)}
td{padding:6px 10px;color:var(--tx);white-space:nowrap;font-size:11.5px}
td.mo{font-family:'DM Mono',monospace;font-size:11px}
.tr-total td{font-weight:700;background:rgba(232,151,58,.1);color:var(--ac)}

/* ── Badges ── */
.bdg{display:inline-block;padding:2px 9px;border-radius:9999px;font-size:10px;font-weight:700;white-space:nowrap}
.b-br{background:rgba(232,151,58,.18);color:var(--ac2)}
.b-gn{background:rgba(34,197,94,.15);color:var(--gn)}
.b-rd{background:rgba(239,68,68,.15);color:var(--rd)}
.b-bl{background:rgba(59,130,246,.15);color:var(--bl)}
.b-am{background:rgba(245,158,11,.15);color:var(--am)}
.b-pu{background:rgba(167,139,250,.15);color:var(--pu)}

/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:8px;border:none;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .18s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{transform:translateY(-1px)}
.btn-dk{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 2px 10px var(--ac-glow)}
.btn-dk:hover{box-shadow:0 4px 20px var(--ac-glow);filter:brightness(1.1)}
.btn-ac{background:linear-gradient(135deg,var(--ac2),#ffb866);color:#1a0000;box-shadow:0 2px 10px var(--ac-glow)}
.btn-ac:hover{box-shadow:0 4px 20px rgba(255,184,102,.4);filter:brightness(1.05)}
.btn-out{background:var(--card2);color:var(--tx);border:1px solid var(--border2)}
.btn-out:hover{border-color:var(--ac);color:var(--ac);background:rgba(232,151,58,.08)}
.btn-gn{background:linear-gradient(135deg,var(--gn2),var(--gn));color:#fff}
.btn-gn:hover{box-shadow:0 4px 16px rgba(34,197,94,.3)}
.btn-rd{background:linear-gradient(135deg,#dc2626,var(--rd));color:#fff}
.btn-rd:hover{box-shadow:0 4px 16px rgba(239,68,68,.3)}
.btn-bl{background:linear-gradient(135deg,#2563eb,var(--bl));color:#fff}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-full{width:100%;justify-content:center}

/* ── Forms ── */
.fg{margin-bottom:10px}
.fl{font-size:11px;color:var(--mu);display:block;margin-bottom:3px;font-weight:500}
.fi{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--tx);background:var(--bg3);font-family:'DM Sans',sans-serif;transition:all .18s}
.fi:focus{outline:none;border-color:var(--ac);background:var(--card2);box-shadow:0 0 0 3px var(--ac-glow)}
.fi option{background:var(--bg3);color:var(--tx)}
.ft{resize:vertical;min-height:60px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--tx2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.tab:hover{border-color:var(--ac);color:var(--ac)}
.tab.active{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 2px 10px var(--ac-glow)}
.fbar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fbtn{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--tx2);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.fbtn:hover{border-color:var(--ac);color:var(--ac)}
.fbtn.active{background:var(--ac);color:#fff;border-color:transparent}

/* ── Misc UI ── */
.sr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.sr:last-child{border:none}
.sl{color:var(--mu)}.sv{font-weight:700;color:var(--tx);font-family:'DM Mono',monospace;font-size:11px}
.dkbox{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--tx);font-size:11px;line-height:2}
.dkbox b{font-family:'Playfair Display',serif;font-size:12px;color:var(--ac)}
.acbox{background:linear-gradient(135deg,rgba(232,151,58,.2),rgba(245,169,78,.1));border:1px solid var(--ac);border-radius:10px;padding:14px;color:var(--tx);font-size:11px;line-height:2}
.infobox{background:rgba(232,151,58,.08);border-left:3px solid var(--ac);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--tx2);line-height:1.7}
.okbox{background:rgba(34,197,94,.08);border:1.5px solid rgba(34,197,94,.3);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.errbox{background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.3);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bsec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.brow{display:flex;justify-content:space-between;padding:5px 14px;border-bottom:1px solid var(--border);font-size:11.5px}
.bi1{padding-left:26px}.btot{background:var(--bg3);font-weight:700;font-size:12px;padding:8px 14px}
.bval{font-family:'DM Mono',monospace;font-size:11px}
.bhdr-dk{background:var(--bg3);border-bottom:1px solid var(--border);padding:9px 14px;color:var(--tx);font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center;font-family:'Playfair Display',serif}
.bhdr-ac{background:linear-gradient(135deg,var(--ac),var(--ac2));padding:9px 14px;color:#fff;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center;font-family:'Playfair Display',serif}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 8px 24px rgba(232,151,58,.2)}
.pimg{height:72px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.pbody{padding:10px}
.lcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lthumb{height:62px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.upa{background:rgba(232,151,58,.06);border:1.5px dashed var(--ac);border-radius:8px;padding:14px;text-align:center;color:var(--mu);font-size:10px;cursor:pointer;transition:background .15s}
.upa:hover{background:rgba(232,151,58,.12)}
.fhero{border-radius:var(--radius);padding:14px;color:#fff}
.fhl{font-size:10px;opacity:.7;margin-bottom:3px}
.fhv{font-size:22px;font-weight:700;font-family:'Playfair Display',serif}
.fhs{font-size:9px;opacity:.6;margin-top:3px}
.cblock{background:#0a0a14;border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'DM Mono',monospace;font-size:10.5px;color:#E8E8E8;line-height:1.8;overflow-x:auto;margin-bottom:10px}
.cblock .cm{color:#7E8A9A}.cblock .ck{color:#C792EA}.cblock .cv{color:#C3E88D}.cblock .cs{color:#82AAFF}.cblock .cn{color:#F78C6C}
.step{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step-body{flex:1}
.step-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:4px;font-family:'Playfair Display',serif}
.step-desc{font-size:11.5px;color:var(--mu);line-height:1.6}
.sunat-ok{background:linear-gradient(135deg,rgba(22,163,74,.8),rgba(34,197,94,.6));border:1px solid var(--gn);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px}
.sunat-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:11.5px;color:rgba(255,255,255,.9)}
.ncard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);margin-bottom:8px}
.ncard-icon{font-size:22px;flex-shrink:0}
.ncard-body{flex:1}
.ncard-title{font-size:12px;font-weight:700;color:var(--tx)}
.ncard-desc{font-size:11px;color:var(--mu);margin-top:2px;line-height:1.5}
.msg{padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:10px}
.msg-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--gn)}
.msg-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--rd)}
.pbox{background:#0a0a14;border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'DM Mono',monospace;font-size:10px;color:#C3E88D;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto}
@media(max-width:900px){:root{--sb:0px}#sb{display:none}.g2,.g3,.g4,.fr{grid-template-columns:1fr}}

/* ── Modals ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(96vw,500px);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--mu);line-height:1;transition:color .15s}
.modal-close:hover{color:var(--rd)}
.act-row{display:flex;gap:5px;flex-wrap:wrap}
td input.fi{padding:3px 6px;font-size:11px;width:100%;min-width:70px}
.img-thumb{width:100%;height:90px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
.img-placeholder{height:90px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:6px;cursor:pointer}
.img-placeholder:hover{border-color:var(--ac);opacity:.85}

/* ══════════════════════════════════════
   POS MODULE — DARK
══════════════════════════════════════ */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:14px;min-height:580px}
.pos-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;align-content:start}
.pos-pcard{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;user-select:none}
.pos-pcard:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 24px var(--ac-glow)}
.pos-pcard.out-of-stock{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.pos-pcard .pimg{height:64px;font-size:26px;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.pos-pcard .pbody{padding:8px}
.pos-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.pos-panel-hdr{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:13px 14px;font-family:'Playfair Display',serif;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.pos-cart{flex:1;overflow-y:auto;padding:10px 12px;max-height:280px}
.pos-cart-empty{text-align:center;padding:30px 10px;color:var(--mu);font-size:12px}
.pos-cart-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.pos-cart-item:last-child{border-bottom:none}
.pos-qty-ctrl{display:flex;align-items:center;gap:4px}
.pos-qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--tx)}
.pos-qty-btn:hover{background:var(--ac);border-color:var(--ac);color:#fff}
.pos-totals{border-top:1px solid var(--border);padding:12px;background:var(--bg3)}
.pos-total-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--tx2)}
.pos-total-row.big{font-size:15px;font-weight:700;color:var(--ac);font-family:'Playfair Display',serif;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
.pos-actions{padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.pos-client-section{padding:8px 12px;border-top:1px solid var(--border);background:var(--card)}
.pos-client-section .fl{font-size:10px}

/* ── Receipt / Invoice Modal ── */
.receipt-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:min(96vw,480px);max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
.receipt-hdr{background:linear-gradient(135deg,#1a1a2e,#0f1042);color:#fff;padding:20px 20px 16px;text-align:center;border-bottom:2px solid var(--ac)}
.receipt-body{padding:18px;font-size:11.5px;color:var(--tx);background:var(--card)}
.receipt-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--ac);letter-spacing:1px}
.receipt-sub{font-size:9px;color:rgba(255,255,255,.5);margin-top:2px;letter-spacing:2px;text-transform:uppercase}
.receipt-divider{border:none;border-top:1px dashed var(--ac);margin:10px 0;opacity:.5}
.receipt-divider-dark{border:none;border-top:1px dashed var(--border2);margin:8px 0}
.receipt-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:var(--tx2)}
.receipt-row span:last-child{color:var(--tx);font-weight:500}
.receipt-row.bold{font-weight:700;font-size:12px;color:var(--tx)}
.receipt-row.total{font-weight:700;font-size:16px;font-family:'Playfair Display',serif;padding:8px 0;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac);margin:8px 0;color:var(--ac)}

function tanSave(id){
  const code=el("mt-code").value.trim(),name=el("mt-name").value.trim(),area=el("mt-area").value,qty=+el("mt-qty").value,unit=+el("mt-unit").value,total=+el("mt-total").value,life=+el("mt-life").value,rate=+el("mt-rate").value/100;
  if(!name){showMsg("tan-msg","⚠ El nombre es requerido","err");return;}
  const esNuevo=!id;
  if(id){const t=TANGIBLES.find(t=>t.id===id);if(t)Object.assign(t,{code,name,area,qty,unit,total,life,rate});}
  else TANGIBLES.push({id:"T"+Date.now(),code,name,area,qty,unit,total,life,rate});
  closeModal();pgTangibles();
  if(typeof logAct==="function")logAct(esNuevo?"Activo tangible creado: "+name:"Activo tangible actualizado: "+name);
  showMsg("tan-page-msg",esNuevo?"✅ Activo registrado correctamente":"✅ Activo actualizado correctamente","ok");
}

function gastoSave(id){
  const c=el("mg-c").value.trim(),m=+el("mg-m").value;
  if(!c){return;}
  const esNuevo=!id;
  if(id){const g=GASTOS.find(g=>g.id===id);if(g)Object.assign(g,{c,m});}
  else GASTOS.push({id:"G"+Date.now(),c,m});
  closeModal();pgCapital();
}

function posRefresh(){
  if(st.ecTab==="pos")pgEcommerce();
}

function posAddProduct(pid){
  const p=INV.find(p=>p.id===pid);
  if(!p||p.stock<=0)return;
  const existing=st.posCart.find(c=>c.pid===pid);
  if(existing){
    if(existing.qty>=p.stock){
      alert('No hay más stock disponible para '+p.name+' ('+p.stock+' disponibles)');return;
    }
    existing.qty++;
  } else {
    // Si el producto tiene tallas, mostrar selector
    if(p.sizes&&p.sizes.length>1){
      posSelectSize(pid);return;
    }
    const sz=p.sizes&&p.sizes.length?p.sizes[0]:'';
    st.posCart.push({pid,name:p.name,price:p.price,qty:1,sz,e:p.e,stock:p.stock});
  }
  pgEcommerce();
}

function posSelectSize(pid){
  const p=INV.find(p=>p.id===pid);if(!p)return;
  const mr=el("modal-root");
  mr.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:360px">
    <div class="modal-title">Seleccionar talla — ${p.name}<button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0">
      ${p.sizes.map(s=>`<button class="btn btn-out" style="font-size:13px;padding:10px;font-weight:700" onclick="posAddWithSize('${pid}',${s})">T${s}</button>`).join("")}
    </div>
  </div></div>`;
}

function posAddWithSize(pid,sz){
  const p=INV.find(p=>p.id===pid);if(!p)return;
  const existing=st.posCart.find(c=>c.pid===pid&&c.sz===sz);
  if(existing){
    if(existing.qty>=p.stock){alert('Stock máximo alcanzado');return;}
    existing.qty++;
  } else {
    st.posCart.push({pid,name:p.name,price:p.price,qty:1,sz,e:p.e,stock:p.stock});
  }
  closeModal();pgEcommerce();
}

function posQty(idx,delta){
  const item=st.posCart[idx];if(!item)return;
  const p=INV.find(p=>p.id===item.pid);
  const newQty=item.qty+delta;
  if(newQty<=0){st.posCart.splice(idx,1);}
  else if(p&&newQty>p.stock){alert('Stock insuficiente. Disponible: '+p.stock);}
  else{item.qty=newQty;}
  pgEcommerce();
}

function posRemove(idx){
  st.posCart.splice(idx,1);
  pgEcommerce();
}

function posClear(){
  st.posCart=[];st.posDisc=0;st.posCliNombre='';st.posCliDni='';st.posCliTel='';
  pgEcommerce();
}

function posCheckout(){
  if(!st.posCart.length)return;
  // Verificar stock de todos los ítems
  for(const item of st.posCart){
    const p=INV.find(p=>p.id===item.pid);
    if(!p||p.stock<item.qty){
      showMsg("pos-msg","⚠ Stock insuficiente para "+item.name,"err");return;
    }
  }
  const sub=r2(st.posCart.reduce((s,i)=>s+i.price*i.qty,0));
  const discAmt=r2(sub*st.posDisc/100);
  const total=r2(sub-discAmt);
  const igv=r2(total*.18/1.18);
  const base=r2(total-igv);
  const now=new Date();
  const fecha=now.toLocaleDateString("es-PE");
  const hora=now.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});
  // Número de comprobante
  const tipo=st.posCompType;
  const serie=tipo==="BOLETA"?"B001":"F001";
  const numComp=COMPROBANTES.length+VENTAS_POS.length+1;
  const numStr=`${serie}-${String(numComp).padStart(8,"0")}`;
  const ventaId="V"+Date.now();
  const numVenta=`POS-${now.getFullYear()}-${String(VENTAS_POS.length+1).padStart(4,"0")}`;

  // Reducir stock
  st.posCart.forEach(item=>{
    const p=INV.find(p=>p.id===item.pid);
    if(p)p.stock=Math.max(0,p.stock-item.qty);
  });

  // Registrar comprobante
  COMPROBANTES.push({
    id:"C"+Date.now(),num:numStr,cli:st.posCliNombre||"Consumidor final",
    td:tipo==="FACTURA"?"RUC "+(st.posCliDni||"—"):"DNI "+(st.posCliDni||"—"),
    sub:base,igv,tot:total,est:"ACEPTADA",fch:now.toISOString().split("T")[0],tipo
  });

  // Registrar venta POS
  const venta={
    id:ventaId,num:numVenta,fecha,hora,
    cliente:st.posCliNombre||"",dni:st.posCliDni||"",tel:st.posCliTel||"",
    items:st.posCart.map(i=>({...i})),
    sub,descPct:st.posDisc,descAmt,total,igv,base,
    pago:st.posPayMethod,comprobante:numStr,tipo,
    estado:"PAGADO"
  };
  VENTAS_POS.push(venta);

  // Registrar en ORDERS también (unificado)
  st.posCart.forEach(item=>{
    ORDERS.push({
      id:"O"+Date.now()+Math.random(),
      num:numVenta,
      pid:item.pid,sz:item.sz,qty:item.qty,
      status:"ENTREGADO",
      total:r2(item.price*item.qty),
      igv:r2(item.price*item.qty*.18/1.18),
      client:st.posCliNombre||"Consumidor final",
      date:now.toISOString().split("T")[0],
      ch:"TIENDA",inv:numStr
    });
  });

  logAct(`Venta POS ${numVenta} · ${numStr} · ${fmt(total)}`);

  // Mostrar recibo
  const ventaSnap={...venta};
  posClear();
  posShowRecibo(ventaSnap);
}

function advOrder(id){const o=ORDERS.find(o=>o.id===id);if(!o)return;const idx=OS.indexOf(o.status);if(idx<OS.length-1){if(OS[idx+1]==="CONFIRMADO")INV=INV.map(p=>p.id===o.pid?{...p,stock:Math.max(p.stock-o.qty,0)}:p);o.status=OS[idx+1];}pgEcommerce();}

function prodSave(id){
  const sku=el("mp-sku").value.trim(),name=el("mp-name").value.trim(),gender=el("mp-gender").value,e=el("mp-e").value.trim()||"👟";
  const cost=+el("mp-cost").value,price=+el("mp-price").value,stock=+el("mp-stock").value,color=el("mp-color").value.trim();
  const sizes=el("mp-sizes").value.split(",").map(s=>+s.trim()).filter(Boolean);
  if(!name){showMsg("mp-msg","⚠ El nombre es requerido","err");return;}
  const esNuevo=!id;
  if(id){const p=INV.find(p=>p.id===id);if(p)Object.assign(p,{sku,name,gender,cost,price,stock,color,sizes,e});}
  else INV.push({id:"P"+Date.now(),sku,name,gender,cost,price,stock,color,sizes,e});
  closeModal();st.ecTab="catalogo";pgEcommerce();
  showMsg("ec-page-msg",esNuevo?"✅ Producto registrado correctamente":"✅ Producto actualizado correctamente","ok");
}

let REPORTES_EXCEL=[];
function repExcelUpload(tipo,inp){
  if(!inp.files[0])return;
  const f=inp.files[0];
  const allowed=["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel"];
  const extOk=/\.(xlsx|xls|csv)$/i.test(f.name);
  if(!extOk&&!allowed.includes(f.type)){showMsg("rep-msg","⚠ Solo se permiten archivos .xlsx, .xls o .csv","err");inp.value="";return;}
  const reader=new FileReader();
  reader.onload=e=>{
    REPORTES_EXCEL.push({id:"RE"+Date.now(),tipo,name:f.name,size:r2(f.size/1024).toFixed(1)+" KB",date:new Date().toLocaleDateString("es-PE"),data:e.target.result,mime:f.type||"application/octet-stream"});
    showMsg("rep-msg","✅ "+f.name+" registrado correctamente","ok");
    pgReportes();
  };
  reader.readAsDataURL(f);
}

function usrSave(id){
  const usuario=el("mu-usr").value.trim(),nombre=el("mu-nom").value.trim(),email=el("mu-email").value.trim(),rol=el("mu-rol").value,estado=el("mu-est").value;
  if(!usuario||!nombre){showMsg("usr-modal-msg","⚠ Usuario y nombre son requeridos","err");return;}
  const esNuevo=!id;
  if(id){const u=USUARIOS.find(u=>u.id===id);if(u)Object.assign(u,{usuario,nombre,email,rol,estado});}
  else USUARIOS.push({id:"U"+Date.now(),usuario,nombre,email,rol,estado,ultimo:"Nunca"});
  logAct(esNuevo?"Usuario creado: "+usuario:"Usuario actualizado: "+usuario);
  closeModal();pgUsuarios();
  showMsg("usr-msg",esNuevo?"✅ Usuario creado correctamente":"✅ Usuario actualizado correctamente","ok");
}
function usrDel(id){
  const u=USUARIOS.find(u=>u.id===id);
  confirmar("¿Eliminar el usuario "+(u?.usuario||id)+"?",()=>{
    USUARIOS.splice(USUARIOS.findIndex(u=>u.id===id),1);
    logAct("Usuario eliminado: "+(u?.usuario||id));
    pgUsuarios();showMsg("usr-msg","🗑 Usuario eliminado","ok");
  });
}

  <div class="pg-sub">Configuración básica de acceso</div>
  <div id="seg-msg"></div>
  <div class="g2">
    <div class="card" style="margin-bottom:0">
      <div class="card-title">🔑 Cambio de contraseña</div>
      <div class="fg"><label class="fl">Contraseña actual</label><input class="fi" id="seg-pw-old" type="password" placeholder="Contraseña actual"></div>
      <div class="fg"><label class="fl">Nueva contraseña</label><input class="fi" id="seg-pw-new" type="password" placeholder="Mínimo 8 caracteres"></div>
      <div class="fg"><label class="fl">Confirmar contraseña</label><input class="fi" id="seg-pw-con" type="password" placeholder="Repetir nueva contraseña"></div>
      <button class="btn btn-dk btn-full" style="margin-top:8px" onclick="segCambiarPw()">🔒 Cambiar contraseña</button>
      <div class="infobox" style="margin-top:12px">La contraseña inicial es <strong>admin123</strong>. Cámbiala inmediatamente por seguridad.</div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="card-title">🕐 Último acceso</div>
      <div class="dkbox" style="margin-bottom:12px">
        <b>Sesión actual:</b><br/>
        Usuario: <span style="color:${S.ac}">admin@solem.pe</span><br/>
        Rol: <span style="color:${S.ac}">Administrador</span><br/>
        Último acceso: <span style="color:#C3E88D">${ultimo}</span><br/>
        IP simulada: <span style="color:#C3E88D">192.168.1.100</span>
      </div>
      <div class="card-title" style="margin-bottom:8px">Accesos recientes</div>
      ${USUARIOS.slice(0,4).map(u=>`<div class="sr">
        <span class="sl">${u.nombre} <span style="font-size:9px">(${u.rol})</span></span>
        <span style="font-size:10px;color:${S.mu};font-family:'DM Mono',monospace">${u.ultimo}</span>
      </div>`).join("")}
    </div>
  </div>`;
}
function segCambiarPw(){
  const old=el("seg-pw-old").value,nw=el("seg-pw-new").value,con=el("seg-pw-con").value;
  if(!old||!nw||!con){showMsg("seg-msg","⚠ Completa todos los campos","err");return;}
  if(old!==_segLastPw){showMsg("seg-msg","⚠ La contraseña actual no es correcta","err");return;}
  if(nw.length<8){showMsg("seg-msg","⚠ La nueva contraseña debe tener al menos 8 caracteres","err");return;}
  if(nw!==con){showMsg("seg-msg","⚠ Las contraseñas nuevas no coinciden","err");return;}
  _segLastPw=nw;
  logAct("Contraseña de administrador cambiada");
  const u=USUARIOS.find(u=>u.rol==="Administrador");
  if(u)u.ultimo=new Date().toLocaleDateString("es-PE")+" "+new Date().toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});
  showMsg("seg-msg","✅ Contraseña actualizada correctamente (simulado)","ok");
}

function render(){
  const pages={
    dashboard:pgDashboard,tangibles:pgTangibles,intangibles:pgIntangibles,
    capital:pgCapital,financiamiento:pgFinanciamiento,balance:pgBalance,
    tributario:pgTributario,ecommerce:pgEcommerce,layouts:pgLayouts,reportes:pgReportes,
    sunat:pgSunat,notif:pgNotif,deploy:pgDeploy,
    admin:pgAdmin,usuarios:pgUsuarios,historial:pgHistorial,seguridad:pgSeguridad,
    costos:pgCostos,
  };
  (pages[st.mod]||pgDashboard)();
}

/* ══════════════════════════════════════════════════════════════
   MÓDULO COSTOS DE PRODUCCIÓN — SOLEM ERP v10
   ══════════════════════════════════════════════════════════════ */

function _cpLoad(){try{return JSON.parse(localStorage.getItem('solem_costos_v1')||'null');}catch(e){return null;}}
function _cpSave(){try{localStorage.setItem('solem_costos_v1',JSON.stringify(CP_PRODUCTOS));}catch(e){}}

let CP_PRODUCTOS=(()=>{
  const saved=_cpLoad();
  if(saved&&Array.isArray(saved)&&saved.length)return saved;
  return INV.map(p=>({id:p.id,mpd:r2(p.cost*0.55),mod:r2(p.cost*0.25),cif:r2(p.cost*0.20),qty:100,rentabilidad:30,comisionPos:5}));
})();

function cpCalc(c){
  const mpd=+c.mpd||0,mod=+c.mod||0,cif=+c.cif||0,qty=Math.max(+c.qty||1,1);
  const rent=(+c.rentabilidad||0)/100,comPos=(+c.comisionPos||0)/100;
  const cp=r2(mpd+mod+cif),cpu=r2(cp/qty);
  const vv=rent<1?r2(cpu/(1-rent)):cpu;
  const pv=r2(vv*1.18),pfPos=r2(pv*(1+comPos*1.18)),mc=r2(vv-cpu);
  return{cp,cpu,vv,pv,pfPos,mc};
}

function cpSyncToInventory(){
  INV.forEach(p=>{const c=CP_PRODUCTOS.find(x=>x.id===p.id);if(!c)return;const res=cpCalc(c);p.cost=res.cpu;p.price=res.pv;p._pfPos=res.pfPos;p._mc=res.mc;p._vv=res.vv;});
  _cpSave();
}

function pgCostos(){
  INV.forEach(p=>{if(!CP_PRODUCTOS.find(c=>c.id===p.id))CP_PRODUCTOS.push({id:p.id,mpd:r2(p.cost*0.55),mod:r2(p.cost*0.25),cif:r2(p.cost*0.20),qty:100,rentabilidad:30,comisionPos:5});});
  const allRes=INV.map(p=>{const c=CP_PRODUCTOS.find(x=>x.id===p.id)||{mpd:0,mod:0,cif:0,qty:1,rentabilidad:0,comisionPos:0};return{...cpCalc(c),name:p.name,e:p.e,stock:p.stock,id:p.id};});
  const utilidadTotal=r2(allRes.reduce((s,r)=>s+r.mc*r.stock,0));
  const margenProm=allRes.length?r2(allRes.reduce((s,r)=>s+(r.vv>0?r.mc/r.vv*100:0),0)/allRes.length):0;
  const masRentable=allRes.length?allRes.reduce((a,b)=>b.mc>a.mc?b:a,allRes[0]):null;
  el("page").innerHTML=`
  <div class="pg-title">🏭 Costos de Producción</div>
  <div class="pg-sub">Cálculo automático en tiempo real · Integrado con Inventario, POS, Ecommerce y Facturación</div>
  <div id="cp-page-msg"></div>
  <div class="cp-grid">
    <div class="cp-card accent"><div class="cp-card-label">Utilidad total estimada</div><div class="cp-card-value" style="color:var(--gn)">${fmt(utilidadTotal)}</div><div class="cp-card-sub">Sobre stock actual</div></div>
    <div class="cp-card green"><div class="cp-card-label">Margen promedio</div><div class="cp-card-value" style="color:var(--ac)">${margenProm.toFixed(1)}%</div><div class="cp-card-sub">Sobre valor de venta</div></div>
    <div class="cp-card blue"><div class="cp-card-label">Productos configurados</div><div class="cp-card-value">${CP_PRODUCTOS.length}</div><div class="cp-card-sub">${INV.length} en inventario</div></div>
    <div class="cp-card purple"><div class="cp-card-label">Más rentable</div><div class="cp-card-value" style="font-size:13px;color:var(--pu)">${masRentable?masRentable.e+' '+masRentable.name.split(' ')[0]:'—'}</div><div class="cp-card-sub">${masRentable?'MC: '+fmt(masRentable.mc):'Sin datos'}</div></div>
    <div class="cp-card" style="border-color:var(--gn)"><div class="cp-card-label">Sincronización</div><div style="margin-top:6px"><span class="cp-sync-badge">✅ Activa</span></div><div class="cp-card-sub" style="margin-top:4px">INV · POS · Facturas</div></div>
  </div>
  ${INV.map(p=>{
    const c=CP_PRODUCTOS.find(x=>x.id===p.id)||{id:p.id,mpd:0,mod:0,cif:0,qty:100,rentabilidad:30,comisionPos:5};
    const res=cpCalc(c);
    return`<div class="cp-sheet" id="cp-sheet-${p.id}">
      <div class="cp-sheet-title">
        <span style="font-size:22px">${p.e}</span>
        <div><div>${p.name} <span class="bdg b-br">${p.sku}</span></div><div style="font-size:10px;color:var(--mu);margin-top:2px">${p.gender} · Stock: ${p.stock} pares</div></div>
        <div style="margin-left:auto"><span class="cp-sync-badge">🔗 Sincronizado</span></div>
      </div>
      <div class="cp-row">
        <div class="cp-field"><label class="cp-label">MPD — Materia Prima Directa (S/)</label><input class="cp-input" type="number" step="0.01" min="0" value="${c.mpd}" oninput="cpUpdate('${p.id}','mpd',this.value)"><div class="cp-formula">Cuero, suelas, pegamentos…</div></div>
        <div class="cp-field"><label class="cp-label">MOD — Mano de Obra Directa (S/)</label><input class="cp-input" type="number" step="0.01" min="0" value="${c.mod}" oninput="cpUpdate('${p.id}','mod',this.value)"><div class="cp-formula">Cortadores, armadores, ensamblaje…</div></div>
        <div class="cp-field"><label class="cp-label">CIF — Costos Indirectos Fabricación (S/)</label><input class="cp-input" type="number" step="0.01" min="0" value="${c.cif}" oninput="cpUpdate('${p.id}','cif',this.value)"><div class="cp-formula">Energía, dep. maquinaria, overhead…</div></div>
      </div>
      <div class="cp-row">
        <div class="cp-field"><label class="cp-label">Cantidad a producir (Q)</label><input class="cp-input" type="number" step="1" min="1" value="${c.qty}" oninput="cpUpdate('${p.id}','qty',this.value)"><div class="cp-formula">Lote de producción</div></div>
        <div class="cp-field"><label class="cp-label">Rentabilidad (%)</label><input class="cp-input" type="number" step="0.5" min="1" max="99" value="${c.rentabilidad}" oninput="cpUpdate('${p.id}','rentabilidad',this.value)"><div class="cp-formula">Margen sobre costo unitario</div></div>
        <div class="cp-field"><label class="cp-label">Comisión POS (%)</label><input class="cp-input" type="number" step="0.5" min="0" value="${c.comisionPos}" oninput="cpUpdate('${p.id}','comisionPos',this.value)"><div class="cp-formula">Cargo tarjeta / plataforma</div></div>
      </div>
      <hr class="cp-separator"/>
      <div class="cp-formula-box"><span class="fk">CP</span>=MPD+MOD+CIF &nbsp;·&nbsp; <span class="fk">CPU</span>=CP÷Q &nbsp;·&nbsp; <span class="fk">VV</span>=CPU÷(1−Rent%) &nbsp;·&nbsp; <span class="fk">PV</span>=VV×1.18 &nbsp;·&nbsp; <span class="fk">POS</span>=PV×(1+Com%×1.18) &nbsp;·&nbsp; <span class="fk">MC</span>=VV−CPU</div>
      <div class="cp-results-grid" id="cp-results-${p.id}">${cpRenderResults(res)}</div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gn btn-sm" onclick="cpAplicarProducto('${p.id}')">✅ Aplicar al Inventario</button>
        <button class="btn btn-out btn-sm" onclick="cpReset('${p.id}')">↺ Restablecer</button>
      </div>
    </div>`;
  }).join("")}
  <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="flex:1"><div class="card-title" style="margin-bottom:4px">Sincronización global</div><div style="font-size:11px;color:var(--mu)">Actualiza precios de costo, venta y POS en Inventario, Ecommerce y Facturación para todos los productos.</div></div>
    <button class="btn btn-dk" style="font-size:13px;padding:10px 20px" onclick="cpSyncAll()">🔄 Sincronizar Todo</button>
  </div>
  <div class="card" style="margin-top:0">
    <div class="card-title">📊 Resumen de Rentabilidad — Todos los Productos</div>
    <div class="twrap cp-hist-table"><table>
      <thead><tr><th>Producto</th><th>CP Total</th><th>CPU</th><th>Val. Venta</th><th>P. Venta</th><th>P. Final POS</th><th>Margen Contrib.</th><th>Rent %</th></tr></thead>
      <tbody>${INV.map(p=>{
        const c=CP_PRODUCTOS.find(x=>x.id===p.id)||{mpd:0,mod:0,cif:0,qty:1,rentabilidad:0,comisionPos:0};
        const res=cpCalc(c);const rentPct=res.vv>0?r2(res.mc/res.vv*100):0;
        return`<tr><td>${p.e} <strong style="color:var(--ac)">${p.name}</strong></td><td class="mo">${fmt(res.cp)}</td><td class="mo">${fmt(res.cpu)}</td><td class="mo" style="color:var(--ac)">${fmt(res.vv)}</td><td class="mo" style="color:var(--bl)">${fmt(res.pv)}</td><td class="mo" style="color:var(--pu)">${fmt(res.pfPos)}</td><td class="mo" style="color:${res.mc>0?'var(--gn)':'var(--rd)'}">${fmt(res.mc)}</td><td><span class="bdg ${rentPct>=20?'b-gn':rentPct>=10?'b-am':'b-rd'}">${rentPct.toFixed(1)}%</span></td></tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>`;
}

function cpRenderResults(res){
  return`
    <div class="cp-result-card highlight"><div class="cp-result-label">Costo de Producción</div><div class="cp-result-value">${fmt(res.cp)}</div><div style="font-size:9px;color:var(--mu)">MPD+MOD+CIF</div></div>
    <div class="cp-result-card"><div class="cp-result-label">Costo Unitario</div><div class="cp-result-value">${fmt(res.cpu)}</div><div style="font-size:9px;color:var(--mu)">CP ÷ Q</div></div>
    <div class="cp-result-card highlight"><div class="cp-result-label">Valor de Venta</div><div class="cp-result-value">${fmt(res.vv)}</div><div style="font-size:9px;color:var(--mu)">CPU ÷ (1−Rent%)</div></div>
    <div class="cp-result-card blue"><div class="cp-result-label">Precio de Venta</div><div class="cp-result-value">${fmt(res.pv)}</div><div style="font-size:9px;color:var(--mu)">VV × 1.18 (IGV)</div></div>
    <div class="cp-result-card purple"><div class="cp-result-label">Precio Final POS</div><div class="cp-result-value">${fmt(res.pfPos)}</div><div style="font-size:9px;color:var(--mu)">PV × (1+Com%×1.18)</div></div>
    <div class="cp-result-card green"><div class="cp-result-label">Margen Contribución</div><div class="cp-result-value">${fmt(res.mc)}</div><div style="font-size:9px;color:var(--mu)">VV − CPU</div></div>`;
}

function cpUpdate(pid,field,val){
  let c=CP_PRODUCTOS.find(x=>x.id===pid);
  if(!c){c={id:pid,mpd:0,mod:0,cif:0,qty:100,rentabilidad:30,comisionPos:5};CP_PRODUCTOS.push(c);}
  c[field]=+val||0;
  const res=cpCalc(c);
  const rd=el('cp-results-'+pid);if(rd)rd.innerHTML=cpRenderResults(res);
  const p=INV.find(x=>x.id===pid);
  if(p){p.cost=res.cpu;p.price=res.pv;p._pfPos=res.pfPos;p._mc=res.mc;p._vv=res.vv;}
  _cpSave();
}

function cpAplicarProducto(pid){
  const c=CP_PRODUCTOS.find(x=>x.id===pid);if(!c)return;
  const res=cpCalc(c);
  const p=INV.find(x=>x.id===pid);
  if(p){p.cost=res.cpu;p.price=res.pv;p._pfPos=res.pfPos;p._mc=res.mc;p._vv=res.vv;}
  _cpSave();
  if(typeof logAct==='function')logAct('Costos aplicados a inventario: '+(p?.name||pid));
  showMsg('cp-page-msg','✅ Precios aplicados al inventario correctamente','ok');
}

function cpSyncAll(){
  cpSyncToInventory();
  if(typeof logAct==='function')logAct('Sincronización global de costos de producción');
  showMsg('cp-page-msg','✅ Todos los precios sincronizados con Inventario, POS y Facturación','ok');
}

function cpReset(pid){
  const p=INV.find(x=>x.id===pid);if(!p)return;
  const idx=CP_PRODUCTOS.findIndex(x=>x.id===pid);
  const def={id:pid,mpd:r2(p.cost*0.55),mod:r2(p.cost*0.25),cif:r2(p.cost*0.20),qty:100,rentabilidad:30,comisionPos:5};
  if(idx>=0)CP_PRODUCTOS[idx]=def;else CP_PRODUCTOS.push(def);
  _cpSave();pgCostos();
}

// Init sync al cargar
(function cpInitSync(){
  CP_PRODUCTOS.forEach(c=>{const p=INV.find(x=>x.id===c.id);if(!p)return;const res=cpCalc(c);p.cost=res.cpu;p.price=res.pv;p._pfPos=res.pfPos;p._mc=res.mc;p._vv=res.vv;});
})();

renderNav();
render();
// Live clock in topbar
function _updateTopClock(){const tc=el("top-clock");if(tc)tc.textContent=new Date().toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
_updateTopClock();setInterval(_updateTopClock,1000);
</script>
